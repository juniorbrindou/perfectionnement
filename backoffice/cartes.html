<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartes · Perfectionnement</title>
<!-- Gestion des cartes (RPC cartes_admin, relayé par nginx sur api-cartes). Aucun secret dans la page.
     La fiche ouverte est dans l'URL (?id=…), avec la réserve et le type. -->
<style>
:root { --nuit: #0b1a3a; --nuit2: #12285a; --or: #f4b63a; --or-fonce: #9a6a10; --creme: #fff8e8; --encre: #1d2433;
  --gris: #6b7487; --ligne: #e6e1d3; --vert: #1f7a47; --rouge: #b3262e; --fond: #f6f2e8; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--encre); background: var(--fond); }
header { background: linear-gradient(160deg, var(--nuit2), var(--nuit)); color: var(--creme); padding: 16px 16px 0; }
.in, main { max-width: 860px; margin: 0 auto; }
header small { color: var(--or); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
header h1 { margin: 2px 0 10px; font-size: 24px; }
nav { display: flex; gap: 4px; }
nav a { color: #c9d3ea; text-decoration: none; padding: 8px 14px; border-radius: 10px 10px 0 0; font-weight: 700; }
nav a.ici { background: var(--fond); color: var(--encre); }
main { padding: 14px 16px 90px; }
button, select, input, textarea { font: inherit; color: inherit; }
.segment { display: flex; background: #fff; border: 1px solid var(--ligne); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 8px; }
.segment button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px; font-weight: 700; cursor: pointer; }
.segment button[aria-pressed="true"] { background: var(--nuit2); color: var(--creme); }
.compteurs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.compteurs span { background: #fff; border: 1px solid var(--ligne); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.compteurs span.manque { border-color: var(--rouge); color: var(--rouge); font-weight: 700; }
.filtres { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.filtres input { grid-column: 1 / -1; }
input[type=text], input[type=search], select, textarea { width: 100%; padding: 9px 10px; border: 1.5px solid #cfc8b6; border-radius: 10px; background: #fff; }
input:focus, select:focus, textarea:focus { outline: 3px solid rgba(244,182,58,.45); border-color: var(--or-fonce); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.bouton { border: 1.5px solid #cfc8b6; background: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 700; cursor: pointer; }
.bouton.principal { background: var(--or); border-color: var(--or); color: #2a1a00; }
.bouton.danger { color: var(--rouge); }
.bouton:disabled { opacity: .45; cursor: default; }
.message { border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-weight: 600; display: none; white-space: pre-line; }
.message.ok { display: block; background: #e7f6ee; color: #11653a; }
.message.ko { display: block; background: #fdecec; color: #8e1d24; }
ul.liste { list-style: none; margin: 0; padding: 0; background: #fff; border: 1px solid var(--ligne); border-radius: 14px; overflow: hidden; }
.liste li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid #f1ede3; }
.liste li:last-child { border-bottom: 0; }
.liste input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--nuit2); }
.liste .corps { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.liste .q { font-weight: 600; display: block; overflow-wrap: anywhere; }
.liste .r { color: var(--gris); font-size: 13px; display: block; }
.etiquette { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: 12px; font-weight: 700; margin-right: 6px; }
.etiquette.valide { background: #e0f2e8; color: var(--vert); }
.etiquette.brouillon { background: #fbefd2; color: var(--or-fonce); }
.etiquette.retiree { background: #eee; color: #666; }
.vide { padding: 16px; color: var(--gris); }
dialog { width: min(640px, 100vw); max-width: 100vw; max-height: 100dvh; border: 0; border-radius: 16px; padding: 0; background: var(--fond); color: var(--encre); }
dialog::backdrop { background: rgba(8,16,36,.65); }
dialog .tete { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--nuit); color: var(--creme); position: sticky; top: 0; }
dialog .tete h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
dialog .tete button { background: none; border: 0; color: var(--creme); font-size: 22px; cursor: pointer; }
dialog .contenu { padding: 14px 16px 16px; }
.champ { margin-bottom: 10px; }
.champ label { display: block; font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
.champ small { color: var(--gris); }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bonne input { border-color: var(--vert); background: #f1faf5; }
textarea.json { min-height: 320px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
@media (max-width: 420px) { .deux { grid-template-columns: 1fr; } dialog { height: 100dvh; border-radius: 0; margin: 0; } }
</style>
</head>
<body>
<header><div class="in">
  <small>Perfectionnement · back-office</small>
  <h1>Cartes</h1>
  <nav><a href="./">Réglages</a><a class="ici" href="cartes.html">Cartes</a></nav>
</div></header>

<main>
  <div class="segment" id="seg-reserve">
    <button type="button" data-v="en_ligne">En ligne</button>
    <button type="button" data-v="telephone">Partie à deux</button>
  </div>
  <div class="segment" id="seg-type">
    <button type="button" data-v="cartes">Cartes</button>
    <button type="button" data-v="depart">Questions de départ</button>
  </div>
  <div class="compteurs" id="compteurs"></div>
  <div class="filtres">
    <input type="search" id="recherche" placeholder="Chercher une question, une réponse, un identifiant" aria-label="Chercher">
    <select id="f-diff" aria-label="Difficulté"><option value="">Toutes difficultés</option><option value="lait">Lait</option><option value="manne">Manne</option><option value="solide">Nourriture solide</option></select>
    <select id="f-statut" aria-label="Statut"><option value="">Brouillons et validées</option><option value="brouillon">Brouillons</option><option value="valide">Validées</option><option value="retiree">Corbeille</option></select>
  </div>
  <div class="actions">
    <button class="bouton principal" type="button" id="nouvelle">Nouvelle fiche</button>
    <button class="bouton" type="button" id="importer">Importer un JSON</button>
    <button class="bouton" type="button" id="exporter">Exporter en JSON</button>
  </div>
  <div class="actions">
    <button class="bouton" type="button" id="tout">Tout cocher</button>
    <button class="bouton" type="button" data-statut="valide">Valider</button>
    <button class="bouton" type="button" data-statut="brouillon">Repasser en brouillon</button>
    <button class="bouton danger" type="button" data-statut="retiree">Mettre à la corbeille</button>
  </div>
  <div class="message" id="message" role="status"></div>
  <ul class="liste" id="liste"><li class="vide">Chargement…</li></ul>
</main>

<dialog id="fiche">
  <div class="tete"><h2 id="fiche-titre"></h2><button type="button" data-fermer aria-label="Fermer">✕</button></div>
  <div class="contenu">
    <div id="formulaire"></div>
    <textarea class="json" id="fiche-json" spellcheck="false" aria-label="Fiche au format JSON" hidden></textarea>
    <div class="message" id="fiche-message" role="alert"></div>
    <div class="actions">
      <button class="bouton principal" type="button" id="enregistrer">Enregistrer</button>
      <button class="bouton" type="button" id="en-json">Modifier en JSON</button>
      <button class="bouton danger" type="button" id="retirer">Mettre à la corbeille</button>
    </div>
  </div>
</dialog>

<dialog id="import">
  <div class="tete"><h2>Importer un JSON</h2><button type="button" data-fermer aria-label="Fermer">✕</button></div>
  <div class="contenu">
    <div class="champ"><label for="fichier">Fichier <small>(même format que data/cartes.json)</small></label><input type="file" id="fichier" accept=".json,application/json"></div>
    <div class="champ"><label for="colle">ou texte collé</label><textarea class="json" id="colle" spellcheck="false" placeholder='[ { "id": "…", "question": "…" } ]'></textarea></div>
    <div class="champ"><label for="mode">Mode</label><select id="mode">
      <option value="fusionner">Ajouter et mettre à jour (le reste ne bouge pas)</option>
      <option value="remplacer">Remplacer : ce qui n'est pas dans le fichier va à la corbeille</option>
    </select></div>
    <div class="message" id="import-message" role="alert"></div>
    <div class="actions">
      <button class="bouton" type="button" id="verifier">Vérifier</button>
      <button class="bouton principal" type="button" id="appliquer" disabled>Importer</button>
    </div>
  </div>
</dialog>

<script>
const params = new URLSearchParams(location.search);
let reserve = params.get("reserve") === "telephone" ? "telephone" : "en_ligne";
let type = params.get("type") === "depart" ? "depart" : "cartes";
let etat = null;
let ouverte = null;      // { nouvelle, json }
const cochees = new Set();
const $ = (id) => document.getElementById(id);
const DIFF = { lait: "Lait", manne: "Manne", solide: "Nourriture solide" };
const CATEG = { personnages: "Personnages", miracles: "Miracles", paraboles: "Paraboles", lieux_evenements: "Lieux et événements" };
const STATUT = { brouillon: "Brouillon", valide: "Validée", retiree: "Corbeille" };

function el(nom, attrs = {}, ...enfants) {
  const e = document.createElement(nom);
  for (const [k, v] of Object.entries(attrs)) { if (k in e && k !== "list") e[k] = v; else e.setAttribute(k, v); }
  e.append(...enfants);
  return e;
}

async function appeler(corps) {
  const r = await fetch("api-cartes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reserve, ...corps }) });
  const t = await r.text();
  let d = {};
  try { d = t ? JSON.parse(t) : {}; } catch (e) { d = { message: r.status === 413 ? "Fichier trop gros." : t.slice(0, 200) }; }
  if (!r.ok) throw new Error((d.message || "Erreur " + r.status).split(" | ").join("\n"));
  return d;
}

function dire(id, texte, ok) {
  const m = $(id);
  m.textContent = texte; m.className = "message" + (texte ? (ok ? " ok" : " ko") : "");
}

function adresse(id) {
  const q = new URLSearchParams({ reserve, type });
  if (id) q.set("id", id);
  history.replaceState(null, "", "cartes.html?" + q);
}

const fiches = () => (etat ? etat[type] : []);

function visibles() {
  const q = $("recherche").value.trim().toLowerCase(), diff = $("f-diff").value, statut = $("f-statut").value;
  return fiches().filter((f) =>
    (statut ? f.status === statut : f.status !== "retiree") &&
    (type !== "cartes" || !diff || f.difficulty === diff) &&
    (!q || [f.id, f.question, f.answer, ...(f.books || [])].join(" ").toLowerCase().includes(q)));
}

function afficher() {
  document.querySelectorAll("#seg-reserve button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === reserve));
  document.querySelectorAll("#seg-type button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === type));
  $("f-diff").disabled = type !== "cartes";
  const c = $("compteurs"); c.innerHTML = "";
  if (etat) {
    const j = etat.jouables;
    Object.keys(DIFF).forEach((d) => c.append(el("span", { className: j[d] < etat.minimum ? "manque" : "" }, `${DIFF[d]} : ${j[d]} jouables`)));
    c.append(el("span", { className: j.depart < 1 ? "manque" : "" }, `Départ : ${j.depart}`));
    c.append(el("span", {}, etat.brouillons ? "Brouillons joués" : "Validées seules"));
  }
  const l = $("liste"); l.innerHTML = "";
  const v = visibles();
  if (!v.length) l.append(el("li", { className: "vide" }, fiches().length ? "Aucune fiche ne correspond aux filtres." : "Aucune fiche. Créez-en une ou importez un JSON."));
  v.forEach((f) => {
    const case_ = el("input", { type: "checkbox", checked: cochees.has(f.id) });
    case_.setAttribute("aria-label", "Cocher " + f.id);
    case_.onchange = () => { case_.checked ? cochees.add(f.id) : cochees.delete(f.id); boutons(); };
    const infos = type === "cartes" ? `${f.id} · ${DIFF[f.difficulty] || f.difficulty} · ${(f.books || []).join(", ")}` : f.id;
    const corps = el("button", { type: "button", className: "corps" },
      el("span", { className: "q" }, f.question),
      el("span", { className: "r" }, el("span", { className: "etiquette " + f.status }, STATUT[f.status] || f.status), `${f.answer} — ${infos}`));
    corps.onclick = () => ouvrir(f);
    l.append(el("li", {}, case_, corps));
  });
  boutons();
}

function boutons() {
  document.querySelectorAll("[data-statut]").forEach((b) => {
    b.disabled = cochees.size === 0;
    b.textContent = { valide: "Valider", brouillon: "Repasser en brouillon", retiree: "Mettre à la corbeille" }[b.dataset.statut] + (cochees.size ? ` (${cochees.size})` : "");
  });
}

async function charger(idOuvert) {
  etat = null; cochees.clear(); afficher();
  try {
    etat = await appeler({ action: "lire" });
    afficher();
    if (idOuvert) { const f = fiches().find((x) => x.id === idOuvert); if (f) ouvrir(f); }
  } catch (e) { $("liste").innerHTML = ""; dire("message", "Impossible de lire les cartes : " + e.message, false); }
}

// ---------------------------------------------------------------- Fiche

function champ(id, libelle, valeur, options) {
  let saisie;
  if (options) {
    saisie = el("select", { id: "c-" + id });
    Object.entries(options).forEach(([v, t]) => saisie.append(el("option", { value: v }, t)));
    saisie.value = valeur;
  } else {
    saisie = ["question", "explanation"].includes(id) ? el("textarea", { id: "c-" + id, rows: 2 }) : el("input", { type: "text", id: "c-" + id });
    saisie.value = valeur;
  }
  return el("div", { className: "champ" }, el("label", { htmlFor: "c-" + id }, libelle), saisie);
}

function formulaire(f) {
  const z = $("formulaire"); z.innerHTML = "";
  const nbFausses = type === "cartes" ? 5 : 4;
  z.append(champ("id", "Identifiant", f.id || ""));
  if (!ouverte.nouvelle) z.querySelector("#c-id").readOnly = true;
  z.append(champ("question", "Question", f.question || ""));
  const bonne = champ("answer", "Bonne réponse", f.answer || ""); bonne.classList.add("bonne"); z.append(bonne);
  for (let i = 0; i < nbFausses; i++) {
    const nom = type === "cartes" && i >= 3 ? `Fausse réponse ${i + 1} (en réserve)` : `Fausse réponse ${i + 1}`;
    z.append(champ("w" + i, nom, (f.wrongs || [])[i] || ""));
  }
  z.append(champ("reference", "Référence (Louis Segond 1910)", f.reference || ""));
  if (type === "cartes") {
    z.append(champ("explanation", "Explication", f.explanation || ""));
    z.append(el("div", { className: "deux" },
      champ("difficulty", "Difficulté", f.difficulty || "lait", DIFF),
      champ("category", "Catégorie", f.category || "personnages", CATEG)));
    const livres = champ("books", "Livre(s), séparés par des virgules", (f.books || []).join(", "));
    const liste = el("datalist", { id: "livres" });
    etat.livres.forEach((l) => liste.append(el("option", { value: l })));
    livres.querySelector("input").setAttribute("list", "livres");
    z.append(el("div", { className: "deux" }, livres, champ("testament", "Testament", f.testament || "AT", { AT: "Ancien", NT: "Nouveau" })), liste);
    z.append(champ("story", "Récit (identifiant, ex. deluge)", f.story || ""));
    const recits = el("datalist", { id: "recits" });
    [...new Set(etat.cartes.map((c) => c.story))].sort().forEach((s) => recits.append(el("option", { value: s })));
    z.querySelector("#c-story").setAttribute("list", "recits");
    z.append(recits);
  }
  z.append(champ("status", "Statut", f.status || "brouillon", STATUT));
}

function lireFormulaire() {
  const v = (id) => { const e = $("c-" + id); return e ? e.value.trim() : ""; };
  const nbFausses = type === "cartes" ? 5 : 4;
  const f = { id: v("id") };
  if (type === "cartes") Object.assign(f, { difficulty: v("difficulty"), testament: v("testament"), books: v("books").split(",").map((s) => s.trim()).filter(Boolean), category: v("category") });
  Object.assign(f, { question: v("question"), answer: v("answer"), wrongs: Array.from({ length: nbFausses }, (_, i) => v("w" + i)).filter(Boolean), reference: v("reference") });
  if (type === "cartes") Object.assign(f, { explanation: v("explanation"), story: v("story") });
  f.status = v("status");
  return f;
}

function idLibre(prefixe) {
  const pris = new Set([...etat.cartes, ...etat.depart].map((f) => f.id));
  let n = 1, id;
  do { id = prefixe + String(n++).padStart(3, "0"); } while (pris.has(id));
  return id;
}

function ouvrir(f) {
  const nouvelle = !f;
  ouverte = { nouvelle, json: false };
  const base = f || { id: idLibre((reserve === "en_ligne" ? "N-" : "T-") + (type === "depart" ? "D-" : "")), status: "brouillon" };
  $("fiche-titre").textContent = nouvelle ? (type === "cartes" ? "Nouvelle carte" : "Nouvelle question de départ") : base.id;
  formulaire(base);
  $("formulaire").hidden = false; $("fiche-json").hidden = true; $("en-json").textContent = "Modifier en JSON";
  $("retirer").hidden = nouvelle || base.status === "retiree";
  dire("fiche-message", "", true);
  $("fiche").showModal();
  adresse(nouvelle ? "" : base.id);
}

$("en-json").onclick = () => {
  try {
    if (!ouverte.json) $("fiche-json").value = JSON.stringify(lireFormulaire(), null, 2);
    else formulaire(JSON.parse($("fiche-json").value));
  } catch (e) { dire("fiche-message", "JSON invalide : " + e.message, false); return; }
  ouverte.json = !ouverte.json;
  $("formulaire").hidden = ouverte.json; $("fiche-json").hidden = !ouverte.json;
  $("en-json").textContent = ouverte.json ? "Revenir au formulaire" : "Modifier en JSON";
  dire("fiche-message", "", true);
};

async function envoyerFiche(f) {
  try {
    const d = await appeler({ action: "enregistrer", nouvelle: ouverte.nouvelle, [type === "cartes" ? "cartes" : "depart"]: [f] });
    etat = d; $("fiche").close(); afficher();
    dire("message", `Fiche ${f.id} enregistrée.`, true);
  } catch (e) { dire("fiche-message", e.message, false); }
}

$("enregistrer").onclick = () => {
  let f;
  try { f = ouverte.json ? JSON.parse($("fiche-json").value) : lireFormulaire(); }
  catch (e) { dire("fiche-message", "JSON invalide : " + e.message, false); return; }
  if (!ouverte.nouvelle && f.id !== $("fiche-titre").textContent) { dire("fiche-message", "L'identifiant d'une fiche existante ne change pas.", false); return; }
  envoyerFiche(f);
};

async function statut(ids, valeur) {
  try {
    etat = await appeler({ action: "statut", ids, statut: valeur });
    cochees.clear(); afficher();
    const n = etat.resume.changees;
    dire("message", `${n} fiche${n > 1 ? "s" : ""} : ${STATUT[valeur].toLowerCase()}.`, true);
    return true;
  } catch (e) { dire($("fiche").open ? "fiche-message" : "message", e.message, false); return false; }
}

$("retirer").onclick = async () => { if (await statut([$("fiche-titre").textContent], "retiree")) $("fiche").close(); };
document.querySelectorAll("[data-statut]").forEach((b) => { b.onclick = () => statut([...cochees], b.dataset.statut); });
$("tout").onclick = () => {
  const v = visibles(), tous = v.every((f) => cochees.has(f.id));
  v.forEach((f) => (tous ? cochees.delete(f.id) : cochees.add(f.id)));
  afficher();
};
$("nouvelle").onclick = () => { if (etat) ouvrir(null); };

// ---------------------------------------------------------------- JSON

$("exporter").onclick = () => {
  if (!etat) return;
  const liste = fiches().filter((f) => f.status !== "retiree");
  const nom = (reserve === "en_ligne" ? "en_ligne-" : "") + (type === "cartes" ? "cartes.json" : "questions_depart.json");
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(liste, null, 2) + "\n"], { type: "application/json" })), download: nom });
  document.body.append(a); a.click(); a.remove();
};

$("importer").onclick = () => { $("colle").value = ""; $("fichier").value = ""; $("appliquer").disabled = true; dire("import-message", "", true); $("import").showModal(); };
$("fichier").onchange = async () => { const f = $("fichier").files[0]; if (f) { $("colle").value = await f.text(); $("appliquer").disabled = true; } };
$("colle").oninput = $("mode").onchange = () => { $("appliquer").disabled = true; };

function lot() {
  let d = JSON.parse($("colle").value);
  if (!Array.isArray(d)) d = d.cartes || d.depart || [d];
  const corps = { action: "importer", mode: $("mode").value };
  // Une carte a une difficulté ; une question de départ n'en a pas.
  corps.cartes = d.filter((f) => "difficulty" in f);
  corps.depart = d.filter((f) => !("difficulty" in f));
  return corps;
}

async function importer(essai) {
  let corps;
  try { corps = lot(); } catch (e) { dire("import-message", "JSON invalide : " + e.message, false); return; }
  try {
    const d = await appeler({ ...corps, essai });
    const r = d.resume;
    const bilan = `${r.ajoutees} ajoutée(s), ${r.modifiees} modifiée(s), ${r.retirees} à la corbeille.`;
    if (essai) {
      dire("import-message", "Fichier valide : " + bilan, true);
      $("appliquer").disabled = r.ajoutees + r.modifiees + r.retirees === 0;
    } else {
      etat = d; $("import").close(); afficher(); dire("message", "Import fait : " + bilan, true);
    }
  } catch (e) { $("appliquer").disabled = true; dire("import-message", e.message, false); }
}
$("verifier").onclick = () => importer(true);
$("appliquer").onclick = () => importer(false);

// ---------------------------------------------------------------- Navigation

document.querySelectorAll("[data-fermer]").forEach((b) => { b.onclick = () => b.closest("dialog").close(); });
$("fiche").addEventListener("close", () => adresse(""));
document.querySelectorAll("#seg-reserve button").forEach((b) => { b.onclick = () => { reserve = b.dataset.v; adresse(""); dire("message", "", true); charger(); }; });
document.querySelectorAll("#seg-type button").forEach((b) => { b.onclick = () => { type = b.dataset.v; cochees.clear(); adresse(""); afficher(); }; });
["recherche", "f-diff", "f-statut"].forEach((id) => $(id).addEventListener("input", () => { cochees.clear(); afficher(); }));

const idDemande = params.get("id");
adresse(idDemande);
charger(idDemande);
</script>
