<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Splash</title>
<style>
* { margin: 0; box-sizing: border-box; }
html, body { width: 375px; height: 812px; overflow: hidden; background: #03102a; }
#scene { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse 120% 60% at 50% 46%, #0d2a6b 0%, #071b48 40%, #03102a 75%); }
.poussiere { position: absolute; border-radius: 50%; background: #ffd77a; box-shadow: 0 0 6px 1px rgba(255,200,90,.8); }
.carte { position: absolute; left: 50%; top: 46%; width: 112px; height: 133px; margin: -66px 0 0 -56px; border-radius: 10px;
  background: url("../../assets/duel/dos_carte.png") center/cover; box-shadow: 0 12px 30px rgba(0,0,0,.6), 0 0 0 2px rgba(255,215,120,.6);
  backface-visibility: hidden; }
.eclair { position: absolute; left: 50%; top: 46%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
  background: radial-gradient(circle, #fffbe6 0%, #ffd36a 30%, rgba(255,180,60,0) 70%); }
.colonne { position: absolute; left: 50%; top: 0; width: 160px; margin-left: -80px; height: 100%;
  background: linear-gradient(90deg, rgba(255,220,130,0), rgba(255,230,160,.55) 50%, rgba(255,220,130,0)); filter: blur(6px); }
.etincelle { position: absolute; left: 50%; top: 46%; width: 4px; height: 14px; margin: -7px 0 0 -2px; border-radius: 2px;
  background: linear-gradient(#fffbe0, #ffb43a); }
#logo { position: absolute; left: 50%; top: 46%; width: 365px; height: 191px; margin: -96px 0 0 -182px; }
.calque { position: absolute; inset: 0; background-size: 100% 100%; }
#livre { clip-path: inset(15% 29% 59% 31.5%); transform-origin: 51% 28%; }
#enseigne { clip-path: polygon(0 0, 31.5% 0, 31.5% 32.5%, 71% 32.5%, 71% 0, 100% 0, 100% 100%, 0 100%); transform-origin: 50% 62%; }
#reflet { clip-path: polygon(0 0, 31.5% 0, 31.5% 32.5%, 71% 32.5%, 71% 0, 100% 0, 100% 100%, 0 100%);
  background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,250,220,.85) 50%, rgba(255,255,255,0) 60%) no-repeat;
  background-size: 300% 100%; background-position: 150% 0; -webkit-mask-size: 100% 100%; mix-blend-mode: screen; }
#accueil { position: absolute; inset: 0; background: url("../../assets/accueil/accueil.png") center top/cover; opacity: 0; }
</style>
</head>
<body>
<div id="scene">
  <div id="accueil"></div>
  <div class="colonne" id="colonne" style="opacity:0"></div>
  <div class="carte" id="c1"></div>
  <div class="carte" id="c2"></div>
  <div class="eclair" id="eclair" style="opacity:0"></div>
  <div id="logo">
    <div class="calque" id="livre"></div>
    <div class="calque" id="enseigne"></div>
    <div class="calque" id="reflet"></div>
  </div>
</div>
<script>
// Le logo est peint sur fond bleu nuit : on rend ce fond transparent (pixels sombres et bleus),
// puis on découpe deux calques : le livre (derrière) et l'enseigne (devant).
function detourer(src) {
  return new Promise((ok) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i], v = p[i + 1], b = p[i + 2];
        const lum = 0.3 * r + 0.59 * v + 0.11 * b;
        const bleute = b - r;                       // fond : nettement plus bleu que rouge
        let a = 1;
        if (bleute > 0) a = Math.min(1, Math.max(0, (lum - 70) / 70));   // fond bleu sombre → transparent
        if (bleute > 25 && lum < 120) a = 0;
        p[i + 3] = Math.round(a * 255);
      }
      g.putImageData(d, 0, 0); ok(c.toDataURL());
    };
    img.src = src;
  });
}

const T = (id) => document.getElementById(id);
const anims = [];
const A = (el, kf, o) => { const a = el.animate(kf, Object.assign({ fill: "both" }, o)); a.pause(); anims.push(a); return a; };

async function monter() {
  const url = await detourer("../../assets/logo/logo.png");
  ["livre", "enseigne"].forEach((id) => T(id).style.backgroundImage = `url(${url})`);
  T("reflet").style.webkitMaskImage = `url(${url})`; T("reflet").style.maskImage = `url(${url})`;
  T("reflet").style.maskSize = "100% 100%";

  // Poussière d'or : scintille du début à la fin.
  const scene = T("scene");
  let graine = 7; const hasard = () => (graine = (graine * 9301 + 49297) % 233280) / 233280;
  for (let k = 0; k < 70; k++) {
    const d = document.createElement("div"); d.className = "poussiere";
    const s = 1 + hasard() * 2.6; d.style.width = d.style.height = s + "px";
    d.style.left = hasard() * 375 + "px"; d.style.top = (120 + hasard() * 580) + "px";
    scene.insertBefore(d, T("colonne"));
    const dx = (hasard() - .5) * 30, dy = -10 - hasard() * 30;
    A(d, [{ opacity: 0, transform: "translate(0,0)" }, { opacity: .9, offset: .3 }, { opacity: .2, offset: .7 }, { opacity: .8, transform: `translate(${dx}px,${dy}px)` }],
      { duration: 3200, delay: hasard() * 300 });
  }

  // 1. Les deux cartes se rencontrent au centre (le duel).
  const glisse = "cubic-bezier(.2,.8,.3,1)";
  A(T("c1"), [{ transform: "translateX(-330px) rotate(-30deg)", opacity: 0 }, { opacity: 1, offset: .3 }, { transform: "translateX(-34px) rotate(-8deg)", opacity: 1 }],
    { duration: 520, delay: 280, easing: glisse });
  A(T("c2"), [{ transform: "translateX(330px) rotate(30deg)", opacity: 0 }, { opacity: 1, offset: .3 }, { transform: "translateX(34px) rotate(8deg)", opacity: 1 }],
    { duration: 520, delay: 280, easing: glisse });
  // 2. Choc : éclair, étincelles, secousse.
  A(T("eclair"), [{ opacity: 0, transform: "scale(.5)" }, { opacity: 1, transform: "scale(9)", offset: .35 }, { opacity: 0, transform: "scale(14)" }],
    { duration: 600, delay: 790, easing: "ease-out" });
  A(scene, [{ transform: "translate(0,0)" }, { transform: "translate(-5px,3px)" }, { transform: "translate(4px,-3px)" }, { transform: "translate(-2px,1px)" }, { transform: "translate(0,0)" }],
    { duration: 260, delay: 800 });
  for (let k = 0; k < 18; k++) {
    const e = document.createElement("div"); e.className = "etincelle"; e.style.opacity = 0; scene.appendChild(e);
    const ang = (k / 18) * 360 + hasard() * 12, dist = 90 + hasard() * 90;
    A(e, [{ transform: `rotate(${ang}deg) translateY(0) scaleY(1)`, opacity: 1 }, { transform: `rotate(${ang}deg) translateY(-${dist}px) scaleY(.4)`, opacity: 0 }],
      { duration: 520, delay: 800, easing: "cubic-bezier(.1,.7,.3,1)", fill: "forwards" });
  }
  // 3. Les cartes se retournent dans la lumière ; une colonne dorée monte.
  A(T("c1"), [{ transform: "translateX(-34px) rotate(-8deg) rotateY(0)", opacity: 1 }, { transform: "translateX(-10px) rotate(-8deg) rotateY(90deg)", opacity: 0 }],
    { duration: 300, delay: 860, easing: "ease-in", fill: "forwards" });
  A(T("c2"), [{ transform: "translateX(34px) rotate(8deg) rotateY(0)", opacity: 1 }, { transform: "translateX(10px) rotate(8deg) rotateY(-90deg)", opacity: 0 }],
    { duration: 300, delay: 860, easing: "ease-in", fill: "forwards" });
  A(T("colonne"), [{ opacity: 0, transform: "scaleX(.2)" }, { opacity: 1, transform: "scaleX(1)", offset: .4 }, { opacity: 0, transform: "scaleX(1.4)" }],
    { duration: 900, delay: 850 });
  // 4. La Bible s'élève et s'ouvre.
  A(T("livre"), [{ transform: "translateY(60px) scale(.35, .2)", opacity: 0, filter: "brightness(3)" },
                 { transform: "translateY(-6px) scale(1.06)", opacity: 1, filter: "brightness(1.6)", offset: .7 },
                 { transform: "translateY(0) scale(1)", opacity: 1, filter: "brightness(1)" }],
    { duration: 520, delay: 920, easing: "cubic-bezier(.2,.8,.3,1)" });
  // 5. L'enseigne tombe avec un rebond.
  A(T("enseigne"), [{ transform: "scale(1.16)", opacity: 0 }, { opacity: 1, offset: .35 },
                    { transform: "scale(.97)", offset: .7 }, { transform: "translateY(0) scale(1)", opacity: 1 }],
    { duration: 480, delay: 1280, easing: "cubic-bezier(.3,1.2,.5,1)" });
  // 6. Reflet de lumière sur les lettres.
  A(T("reflet"), [{ backgroundPosition: "150% 0", opacity: 1 }, { backgroundPosition: "-50% 0", opacity: 1 }],
    { duration: 520, delay: 1780, easing: "ease-in-out" });
  // 7. Le logo monte à sa place sur l'accueil, qui apparaît dessous.
  A(T("logo"), [{ transform: "translate(0,0) scale(1)" }, { transform: "translate(0,-210px) scale(1.07)" }],
    { duration: 560, delay: 2280, easing: "cubic-bezier(.5,0,.2,1)" });
  A(T("accueil"), [{ opacity: 0 }, { opacity: 1 }], { duration: 380, delay: 2620, easing: "ease-in" });
  A(T("livre"), [{ opacity: 1 }, { opacity: 0 }], { duration: 220, delay: 2840, fill: "forwards" });
  A(T("enseigne"), [{ opacity: 1 }, { opacity: 0 }], { duration: 220, delay: 2840, fill: "forwards" });
  window.pret = true;
}
window.allerA = (ms) => anims.forEach((a) => (a.currentTime = ms));
monter();
</script>
</body>
</html>
