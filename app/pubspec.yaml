name: perfectionnement
description: "Perfectionnement : le duel des cartes bibliques."
publish_to: 'none'

# Code de version au-dessus de celui de Godot (600) : la version Flutter s'installe par-dessus.
version: 0.7.2+702

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  nakama: ^1.4.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets/ et data/ sont des jonctions vers les dossiers de la racine, partagés avec la
  # version Godot pendant la réécriture (voir .gitignore).
  assets:
    - assets/accueil/accueil.png
    - assets/duel/pieces.png
    - assets/duel/couronne.png
    - assets/duel/dos_carte_bleu.jpg
    - assets/duel/dos_illustration.jpg
    - assets/duel/paysage.png
    - assets/duel/dos_carte.png
    - assets/logo/logo_livre.png
    - assets/logo/logo_enseigne.png
    - assets/sons/carte.wav
    - assets/sons/tic.wav
    - assets/sons/juste.wav
    - assets/sons/faux.wav
    - assets/sons/victoire.wav
    - assets/sons/defaite.wav
    - assets/sons/feu.wav
    - assets/sons/tonnerre.wav
    - assets/sons/musique/musique_1.mp3
    - assets/aventure/etoile.png
    - assets/duel/lait.jpg
    - assets/duel/manne.jpg
    - assets/duel/pain.jpg
    - assets/illustrations/
    - data/aventure.json
    - data/cartes.json
    - data/questions_depart.json
    - data/recits.json

  shaders:
    - shaders/feu_dore.frag

  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Garamond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
